[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snapkeep"
version = "0.1.0"
description = "A cross-platform project snapshot and backup tool."
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "SnapKeep contributors" }
]
dependencies = []

[project.scripts]
snapkeep = "snapkeep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
